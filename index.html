<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Panel de Accesos - Drivo</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #1C1C1E;
            padding: 24px;
            border-radius: 20px;
            border: 1px solid #333;
            width: 400px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #fff;
            text-align: center;
        }

        .user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #333;
        }

        .user-row:last-child {
            border-bottom: none;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .btn-true {
            background: #4caf50;
            color: white;
        }

        .btn-false {
            background: #f44336;
            color: white;
        }

        .email-text {
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Gestión de Permisos Drivo</h2>
        <div id="user-list">Cargando correos...</div>
    </div>

    <script>
        // Aquí apuntarás a la URL final que te dé Cloudflare Pages o tu servidor
        const jsonUrl = 'whitelist.json';

        async function loadData() {
            try {
                const res = await fetch(jsonUrl);
                const data = await res.json();
                const container = document.getElementById('user-list');
                container.innerHTML = '';

                for (const [email, hasAccess] of Object.entries(data)) {
                    const btnClass = hasAccess ? 'btn-true' : 'btn-false';
                    const btnText = hasAccess ? 'Permitido' : 'Bloqueado';

                    container.innerHTML += `
                        <div class="user-row">
                            <span class="email-text">${email}</span>
                            <button class="${btnClass}">${btnText}</button>
                        </div>`;
                }
            } catch (e) {
                document.getElementById('user-list').innerHTML = 'Error al cargar los datos.';
            }
        }

        loadData();
    </script>
</body>

</html>
